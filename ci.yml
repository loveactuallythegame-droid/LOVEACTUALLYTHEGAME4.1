name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'
  POSTGRES_VERSION: '15'

jobs:
  # Lint and Type Check
  lint-and-type-check:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🔍 Run ESLint
      run: npm run lint

    - name: 📝 Type check
      run: npm run type-check

    - name: 💅 Check formatting
      run: npm run format:check

  # Security Audit
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🔒 Run security audit
      run: npm audit --audit-level=moderate

    - name: 🔍 Run dependency check
      run: npx depcheck

  # Test Suite
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: love_actually_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🗄️ Setup test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/love_actually_test
      run: |
        npm run db:generate
        npm run db:push

    - name: 🧪 Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/love_actually_test
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY_TEST }}
        NEXTAUTH_SECRET: test-secret-key-for-ci
        NEXTAUTH_URL: http://localhost:3000
      run: npm run test:coverage

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # Build Test
  build:
    name: 🏗️ Build Test
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, security-audit]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🔧 Generate Prisma client
      run: npm run db:generate

    - name: 🏗️ Build application
      run: npm run build

    - name: 📦 Cache build
      uses: actions/cache@v3
      with:
        path: .next
        key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

  # Performance Testing
  performance:
    name: ⚡ Performance Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🏗️ Build application
      run: npm run build

    - name: 🚀 Start application
      run: npm start &
      env:
        PORT: 3000

    - name: ⏳ Wait for app to be ready
      run: npx wait-on http://localhost:3000 --timeout 60000

    - name: 🔍 Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './.lighthouserc.json'
        uploadArtifacts: true
        temporaryPublicStorage: true

  # E2E Testing
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: love_actually_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🗄️ Setup test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/love_actually_e2e
      run: |
        npm run db:generate
        npm run db:push
        npm run db:seed

    - name: 🎭 Install Playwright
      run: npx playwright install --with-deps

    - name: 🏗️ Build application
      run: npm run build

    - name: 🚀 Start application
      run: npm start &
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/love_actually_e2e
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY_TEST }}
        NEXTAUTH_SECRET: test-secret-key-for-e2e
        NEXTAUTH_URL: http://localhost:3000
        PORT: 3000

    - name: ⏳ Wait for app to be ready
      run: npx wait-on http://localhost:3000 --timeout 60000

    - name: 🎭 Run E2E tests
      run: npx playwright test

    - name: 📸 Upload E2E artifacts
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  # Dr. Marcie AI Testing
  ai-testing:
    name: 🤖 Dr. Marcie AI Tests
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🤖 Test AI Response Generation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY_TEST }}
      run: npm run test:ai

    - name: 🎭 Test Dr. Marcie Personality Levels
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
      run: npm run test:personality

    - name: 🔊 Test Voice Synthesis
      env:
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY_TEST }}
      run: npm run test:voice

  # Deployment Preview (for PRs)
  deploy-preview:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Vercel Preview
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./
        scope: ${{ secrets.VERCEL_ORG_ID }}

  # Production Deployment (main branch only)
  deploy-production:
    name: 🌟 Deploy Production
    runs-on: ubuntu-latest
    needs: [test, build, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://loveactuallygame.com
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Vercel Production
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./
        scope: ${{ secrets.VERCEL_ORG_ID }}

    - name: 🔄 Database Migration (Production)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
      run: |
        npm ci
        npm run db:generate
        npm run db:push

    - name: 📧 Notify Deployment Success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🎉 Love, Actually Game deployed successfully to production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Cleanup
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-preview, deploy-production]
    if: always()
    
    steps:
    - name: 🗑️ Clean up old preview deployments
      run: echo "Cleanup completed"

# Notification on failure
  notify-failure:
    name: 📢 Notify Failure
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, security-audit, test, build]
    if: failure()
    
    steps:
    - name: 📧 Send failure notification
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ Love, Actually Game CI/CD pipeline failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}